<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ふわふわメモ</title>
  
  <!-- PWA設定 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#FFDEE9">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- 可愛らしいフォント（Kiwi Maru）の読み込み -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    /* 全体のスタイル */
    :root {
      --bg-color: #FFDEE9; /* 薄いピンク */
      --main-color: #B5FFFC; /* 薄い水色 */
      --text-color: #5D5D5D;
      --accent-color: #FF9A8B; /* アクセントのコーラル */
    }

    body {
      font-family: 'Kiwi Maru', serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 10px;
      color: #FF80AB;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
    }

    /* メモエリアのスタイル */
    #memo-container {
      width: 90%;
      max-width: 400px;
      background: rgba(255, 255, 255, 0.7);
      padding: 20px;
      border-radius: 30px; /* とても丸く */
      box-shadow: 0 10px 20px rgba(0,0,0,0.05);
      border: 4px solid var(--main-color); /* 水色の枠線 */
    }

    textarea {
      width: 100%;
      height: 300px;
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 1.1rem;
      line-height: 1.6;
      color: var(--text-color);
      resize: none;
      outline: none;
      padding: 0;
    }

    textarea::placeholder {
      color: #FFC1CC;
      opacity: 0.8;
    }

    /* フッターのステータス表示 */
    #status {
      font-size: 0.8rem;
      color: #FF9A8B;
      margin-top: 15px;
      font-weight: 300;
    }
  </style>
</head>
<body>

  <h1>୨୧ ふわふわメモ ୨୧</h1>

  <div id="memo-container">
    <textarea id="memo" placeholder="ここに、だいじなことをメモしてね..."></textarea>
  </div>

  <p id="status"></p>

  <script>
    const memoArea = document.getElementById('memo');
    const status = document.getElementById('status');

    // ローカルストレージから読み込み
    memoArea.value = localStorage.getItem('fuwafuwa-memo') || '';

    // 入力されるたびに保存
    memoArea.addEventListener('input', () => {
      localStorage.setItem('fuwafuwa-memo', memoArea.value);
      status.textContent = '自動で保存したよ ♪';
      setTimeout(() => status.textContent = '', 2000);
    });

    // Service Workerの登録（PWA化）
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('わーい！登録できたよ！', reg))
          .catch(err => console.log('ごめんね、エラーかも...', err));
      });
    }
  </script>
</body>
</html>
